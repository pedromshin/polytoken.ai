name: Migrate prod DB

# Applies pending Drizzle migrations to the PRODUCTION Supabase database.
# Manual-dispatch only, guarded by a typed confirmation, so it never fires by
# accident. The DB connection happens on the GitHub runner (which can reach
# Supabase over the public internet) using a repo/environment secret.
#
# Secret names accepted (first non-empty wins), so a name mismatch or repo-vs-
# environment scope no longer silently fails:
#   POSTGRES_URL_NON_POOLING: PROD_POSTGRES_URL_NON_POOLING | POSTGRES_URL_NON_POOLING | DATABASE_URL_NON_POOLING | DATABASE_URL
#   POSTGRES_URL:             PROD_POSTGRES_URL | POSTGRES_URL | DATABASE_URL
#   SUPABASE_URL:             PROD_SUPABASE_URL | SUPABASE_URL | NEXT_PUBLIC_SUPABASE_URL

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE-PROD to proceed'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Bind to the `production` Environment so environment-scoped secrets resolve
    # (repo-level secrets resolve too). Any required-reviewer gate also applies.
    environment: production
    steps:
      - name: Guard — require typed confirmation
        if: ${{ github.event.inputs.confirm != 'MIGRATE-PROD' }}
        run: |
          echo "::error::Refusing to run: 'confirm' must be exactly MIGRATE-PROD (got '${{ github.event.inputs.confirm }}')."
          exit 1

      - name: Report which secret NAMES are present (booleans only — never values)
        run: |
          echo "PROD_POSTGRES_URL_NON_POOLING set: ${{ secrets.PROD_POSTGRES_URL_NON_POOLING != '' }}"
          echo "POSTGRES_URL_NON_POOLING set:      ${{ secrets.POSTGRES_URL_NON_POOLING != '' }}"
          echo "DATABASE_URL_NON_POOLING set:      ${{ secrets.DATABASE_URL_NON_POOLING != '' }}"
          echo "DATABASE_URL set:                  ${{ secrets.DATABASE_URL != '' }}"
          echo "PROD_POSTGRES_URL set:             ${{ secrets.PROD_POSTGRES_URL != '' }}"
          echo "POSTGRES_URL set:                  ${{ secrets.POSTGRES_URL != '' }}"
          echo "PROD_SUPABASE_URL set:             ${{ secrets.PROD_SUPABASE_URL != '' }}"
          echo "SUPABASE_URL set:                  ${{ secrets.SUPABASE_URL != '' }}"
          echo "NEXT_PUBLIC_SUPABASE_URL set:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace deps
        run: npm ci

      - name: Apply migrations to prod
        working-directory: packages/db
        env:
          # createEnv (client.ts) reads runtimeEnv: process.env. First non-empty
          # secret name wins (an unset secret is an empty string; '' || x -> x).
          POSTGRES_URL_NON_POOLING: ${{ secrets.PROD_POSTGRES_URL_NON_POOLING || secrets.POSTGRES_URL_NON_POOLING || secrets.DATABASE_URL_NON_POOLING || secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.PROD_POSTGRES_URL || secrets.POSTGRES_URL || secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL || secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: npx tsx src/migrate.ts
