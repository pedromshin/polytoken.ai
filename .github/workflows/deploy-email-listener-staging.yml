name: Deploy — Email Listener (Staging)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "apps/email-listener/**"
      - ".github/workflows/deploy-email-listener-staging.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nauta-services-email-listener
  # Worker image repo (Track 3a, docs/DURABLE-WORKER-RUNBOOK.md §P4): sibling repo
  # to the listener, same tag scheme (:staging here). The worker is a SECOND
  # container in the SAME task def/service (essential = false). Its lanes below
  # (test-worker + deploy-worker) are job-level gated on the WORKER_DEPLOY_ENABLED
  # repo variable — while that variable is unset they are skipped and this
  # workflow behaves exactly as it did without them.
  WORKER_ECR_REPOSITORY: nauta-services-email-worker
  ECS_CLUSTER: nauta-services-email-listener
  ECS_SERVICE: nauta-services-email-listener-staging
  IMAGE_TAG: staging

permissions: {}

concurrency:
  group: deploy-email-listener-staging
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/email-listener
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest

  # Worker own-gate — mirrors the prod workflow's test-worker job
  # (deploy-email-listener.yml) 1:1, with one staging-only addition: the
  # job-level `if` on the same WORKER_DEPLOY_ENABLED expression the prod file
  # uses on its "Push worker image" step. Unset variable = job skipped.
  test-worker:
    name: Test (worker)
    if: vars.WORKER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck -w @polytoken/worker
      - run: npm run test -w @polytoken/worker

  # Worker image lane — the same build/scan/push steps the prod workflow runs
  # inside its deploy job, lifted into their own job so the WORKER_DEPLOY_ENABLED
  # gate can be job-level (a skipped job means zero behavior change while the
  # variable is unset). Pushes :staging (IMAGE_TAG above). The listener deploy
  # job below waits on this lane so its force-new-deployment picks up the fresh
  # worker image — the same ordering the prod workflow guarantees by sequencing
  # the worker push before the ECS roll inside one job.
  deploy-worker:
    name: Build & push (worker)
    if: vars.WORKER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: test-worker
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build worker image
        run: |
          docker build \
            -f apps/worker/Dockerfile \
            -t ${{ steps.ecr.outputs.registry }}/$WORKER_ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Trivy scan worker (CRITICAL/HIGH blocks)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.WORKER_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push worker image
        run: docker push ${{ steps.ecr.outputs.registry }}/$WORKER_ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    # Wiring for the gated worker lanes. While WORKER_DEPLOY_ENABLED is unset,
    # test-worker and deploy-worker are skipped and this condition reduces to
    # exactly the previous behavior (run iff `test` succeeded; !cancelled()
    # preserves manual-cancel semantics — it is required because a skipped need
    # would otherwise fail the implicit success() check and skip this job).
    # While enabled, a worker test/build/push failure blocks the roll, matching
    # the prod workflow's needs: [test, test-worker] + in-job push ordering.
    needs: [test, test-worker, deploy-worker]
    if: >-
      ${{ !cancelled() &&
      needs.test.result == 'success' &&
      (needs.test-worker.result == 'success' || needs.test-worker.result == 'skipped') &&
      (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build \
            -f apps/email-listener/Dockerfile \
            -t ${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Trivy scan (CRITICAL/HIGH blocks)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push image
        run: docker push ${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      - name: Smoke test
        if: vars.STAGING_HEALTH_URL != ''
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ vars.STAGING_HEALTH_URL }}")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Staging health check failed (HTTP $STATUS)."
            exit 1
          fi
          echo "Staging is healthy (HTTP $STATUS)."
