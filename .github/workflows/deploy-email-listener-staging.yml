name: Deploy — Email Listener (Staging)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "apps/email-listener/**"
      - "apps/worker/**"
      - ".github/workflows/deploy-email-listener-staging.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nauta-services-email-listener
  # Worker image repo (Track 3a, docs/DURABLE-WORKER-RUNBOOK.md §P4): sibling repo to the
  # listener, same tag scheme (:latest prod / :staging staging). This workflow mirrors the
  # production workflow's posture EXACTLY — worker test/build/scan always run; only the ECR
  # push is gated on WORKER_DEPLOY_ENABLED — so a broken worker change reds STAGING first
  # instead of merging green on dev and redding production.
  WORKER_ECR_REPOSITORY: nauta-services-email-worker
  ECS_CLUSTER: nauta-services-email-listener
  ECS_SERVICE: nauta-services-email-listener-staging
  IMAGE_TAG: staging

permissions: {}

concurrency:
  group: deploy-email-listener-staging
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/email-listener
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest

  # Worker own-gate (mirrors the listener's test job AND the production workflow): typecheck +
  # vitest for @polytoken/worker before any image is pushed. Runs UNCONDITIONALLY — never gate
  # this job on WORKER_DEPLOY_ENABLED, or worker breakage skips staging and surfaces in prod.
  # Node 22 + full root `npm ci` matches ci-web-and-packages.yml.
  test-worker:
    name: Test (worker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck -w @polytoken/worker
      - run: npm run test -w @polytoken/worker

  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    needs: [test, test-worker]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build \
            -f apps/email-listener/Dockerfile \
            -t ${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      # The worker image is ALWAYS built + scanned (ship-dark gate: a broken worker
      # Dockerfile blocks the deploy the moment it lands, not on cutover day), but
      # only PUSHED once the Track 3a P4 infra exists — see the push step below.
      - name: Build worker image
        run: |
          docker build \
            -f apps/worker/Dockerfile \
            -t ${{ steps.ecr.outputs.registry }}/$WORKER_ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Trivy scan (CRITICAL/HIGH blocks)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy scan worker (CRITICAL/HIGH blocks)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.WORKER_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push image
        run: docker push ${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

      # Infra-gated (same repo-variable pattern as the smoke test, IDENTICAL to production's
      # step-level gate): set the GitHub Actions repo variable WORKER_DEPLOY_ENABLED=true only
      # after the runbook's P4 Terraform is applied — ECR repo $WORKER_ECR_REPOSITORY created,
      # the deploy role's EcrPush statement widened to it (iam.tf), and the worker container
      # (essential = false) added to the task definition (ecs.tf). Until then a push would fail
      # against a nonexistent repo and needlessly redden listener deploys. This is the ONLY
      # worker step that gate skips — test/build/scan above always run.
      - name: Push worker image
        if: vars.WORKER_DEPLOY_ENABLED == 'true'
        run: docker push ${{ steps.ecr.outputs.registry }}/$WORKER_ECR_REPOSITORY:$IMAGE_TAG

      # One force-new-deployment re-pulls every mutable-tag image in the task def —
      # once the worker container exists there (runbook §P4), this single step rolls
      # the listener AND the worker together.
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      - name: Smoke test
        if: vars.STAGING_HEALTH_URL != ''
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ vars.STAGING_HEALTH_URL }}")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Staging health check failed (HTTP $STATUS)."
            exit 1
          fi
          echo "Staging is healthy (HTTP $STATUS)."
